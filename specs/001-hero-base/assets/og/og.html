<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>OG — Tomás De Miguel</title>
<style>
  /* Fuente de la imagen para compartir (1200×630). Se exporta con Chrome headless (T032). */
  @font-face { font-family: 'Geist Pixel Square'; src: url('../../../../public/fonts/GeistPixel-Square.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; src: url('../../../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Geist Mono'; src: url('../../../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a0a0a; }
  body { display: flex; align-items: center; justify-content: space-between; padding: 0 80px; gap: 48px;
    background-image: radial-gradient(circle, #262626 1.5px, transparent 2px); background-size: 24px 24px; }
  .text { display: flex; flex-direction: column; gap: 28px; }
  h1 { font-family: 'Geist Pixel Square', monospace; font-weight: 400; font-size: 108px; line-height: 1; color: #ffb000; }
  .role { font-family: 'Geist', sans-serif; font-size: 30px; color: #ededed; }
  .stack { font-family: 'Geist Mono', monospace; font-size: 26px; color: #a1a1a1; }
  .photo { position: relative; width: 340px; height: 340px; flex-shrink: 0;
    mask-image: radial-gradient(circle at center, #000 55%, transparent 71%), radial-gradient(circle, #000 2.6px, transparent 3.1px);
    mask-size: 100% 100%, 7px 7px; mask-repeat: no-repeat, repeat; mask-composite: intersect; }
  .photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.25); }
  .photo span { position: absolute; inset: 0; background: #ffb000; mix-blend-mode: multiply; }
</style>
</head>
<body>
  <div class="text">
    <h1>Tomás<br />De Miguel</h1>
    <p class="role">Frontend Developer Semi Senior<br />AI-Driven Development</p>
    <p class="stack">React · TypeScript · Next.js</p>
  </div>
  <div class="photo"><img src="../../../../src/assets/profile/tomas-640.jpg" alt="" /><span></span></div>
</body>
</html>
